openapi: 3.0.3
info:
  title: Records API
  version: 1.0.0
  description: Training API for one team's resource. Synthetic data only.
paths:
  /v1/records:
    get:
      summary: List all records
      responses:
        "200":
          description: A list of records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
    post:
      summary: Create a record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRecord"
      responses:
        "201":
          description: The created record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/InvalidInput"
  /v1/records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get one record
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Replace a record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRecord"
      responses:
        "200":
          description: The updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete a record
      responses:
        "200":
          description: Record deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/service/citizens/{citizenId}/status:
    parameters:
      - name: citizenId
        in: path
        required: true
        schema:
          type: string
          pattern: "^CIT-\\d{8}$"
    get:
      summary: Status of a citizen's latest record, for other administrations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid service token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidInput:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Record not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    ServiceStatus:
      type: object
      additionalProperties: false
      required: [citizenId, status, submittedOn]
      properties:
        citizenId:
          type: string
          pattern: "^CIT-\\d{8}$"
        status:
          type: string
          enum: [SUBMITTED, IN_REVIEW, APPROVED, REJECTED]
        submittedOn:
          type: string
          format: date
    NewRecord:
      type: object
      required: [citizenId, status]
      properties:
        citizenId:
          type: string
          pattern: "^CIT-\\d{8}$"
          example: CIT-10000003
        status:
          type: string
          enum: [SUBMITTED, IN_REVIEW, APPROVED, REJECTED]
    Record:
      allOf:
        - $ref: "#/components/schemas/NewRecord"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
